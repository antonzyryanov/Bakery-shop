apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutrition-worker
  namespace: bakery-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nutrition-worker
  template:
    metadata:
      labels:
        app: nutrition-worker
    spec:
      containers:
        - name: nutrition-worker
          image: bakery-nutrition-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NUTRITION_DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: bakery-config
                  key: NUTRITION_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: bakery-config
                  key: REDIS_URL
            - name: CELERY_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: bakery-config
                  key: CELERY_BROKER_URL
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: bakery-config
                  key: CELERY_RESULT_BACKEND
            - name: INTERNAL_API_KEY
              valueFrom:
                configMapKeyRef:
                  name: bakery-config
                  key: NUTRITION_INTERNAL_KEY
